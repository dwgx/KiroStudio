# 日常 CI 门禁：push / PR 用出厂特性跑测试。
#
# 与 release.yml 的区别：release 只在 tag v* / 手动触发时跑，且带版本闸门与发资产；
# 本 workflow 覆盖日常提交，避免回归全靠本地自觉（P1-10）。
# 与 deploy-build.yml 同用 `cargo test --no-default-features --locked`；
# rust-cache 写法对齐那两个文件。不改 release 的 tag 闸门，不启 skiapi Docker。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前端产物 admin-ui/dist 必须在 cargo 之前存在 —— rust-embed(#[derive(Embed)]) 是
      # 编译期嵌入，dist 缺失时 Asset::get 无法生成，测试也编不过。与 release/deploy-build 一致。
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: 构建前端 (admin-ui/dist)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master（官方指引：SHA 必须落在 master 历史内）
        with:
          toolchain: 1.97.1
      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-test-no-default
      - name: 运行测试（出厂特性：纯 rustls + --locked）
        run: cargo test --no-default-features --locked
