# 发布流水线：打 tag v* 或手动触发时，构建前端 + musl 静态二进制并上传到 Release
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# 顶层只给读：写权限按 job 最小化下发（供应链教训——kiro-lb 2026-10 事件里，
# 顶层 contents: write 让每个 job 都拿到可推代码的 token，被注入的 workflow 一步得手）。
permissions:
  contents: read

jobs:
  # 测试门禁：出厂二进制一律 --no-default-features（纯 rustls）。历史上 cargo test 只跑默认
  # 特性(native-tls)，从未覆盖真正发布的 --no-default-features 构建 = 出厂配置存在测试盲区。
  # 这里在任何产物构建前，先用**出厂特性**跑全量测试；两个 build 任务 needs 它，测试不过不发布。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前端产物 admin-ui/dist 必须在 cargo 之前存在 —— rust-embed(#[derive(Embed)]) 是
      # 编译期嵌入，dist 缺失时 Asset::get 无法生成，测试也编不过。故与 build 任务一致先构建前端。
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: 构建前端 (admin-ui/dist)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master（官方指引：SHA 必须落在 master 历史内）
        with:
          toolchain: 1.97.1
      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-no-default
      - name: 运行测试（出厂特性：纯 rustls + --locked）
        run: cargo test --no-default-features --locked

      # 发版闸门：tag 必须与 Cargo.toml 的 version 完全一致。
      #
      # 为什么必须卡这一步：OTA 的 has_update 判定是「远端 tag 列表的最大版本 > LOCAL_VERSION」，
      # 而 LOCAL_VERSION 是编译期注入的 env!("CARGO_PKG_VERSION")。若打了 v0.7.44 的 tag 却忘记
      # bump Cargo.toml（仍是 0.7.43），产出的二进制自报 0.7.43 →
      #   升级 → 重启 → 仍然发现"有新版 0.7.44" → 再升级 …… **无限升级循环**，
      # 且每一轮都真的重写一次二进制。这是整条发布链上唯一没有任何自动校验的地方。
      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$TAG  Cargo.toml=$CARGO_VER"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::tag(v$TAG) 与 Cargo.toml version($CARGO_VER) 不一致。"
            echo "::error::直接发布会导致 OTA 无限升级循环（二进制自报旧版本，永远认为有新版）。"
            echo "::error::请修正 Cargo.toml 的 version 后重新打 tag。"
            exit 1
          fi
          echo "✅ 版本一致"

  build-release:
    needs: test
    permissions:
      contents: write   # 上传 Release 资产（仅此 job 需要写）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前端必须在 cargo build 之前产出 admin-ui/dist —— rust-embed 是编译期嵌入
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: 构建前端 (admin-ui/dist)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Rust (musl 目标)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master（官方指引：SHA 必须落在 master 历史内）
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl

      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-release

      # 纯 rustls：--no-default-features 去掉 native-tls(vendored openssl)，走 webpki/native-roots。
      # rustls 的 ring 后端在 musl 通常可编译；若遇 aws-lc-rs 在 musl 报错(缺 cmake/交叉 C 工具链)，
      # 可改用 target=x86_64-unknown-linux-gnu(去掉本步骤 musl-tools 与 --target 的 musl 部分)。
      - name: 构建 release 二进制
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl

      - name: 打包产物 + 生成校验和
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/kirostudio
          cp "$BIN" kirostudio-linux-x86_64
          sha256sum kirostudio-linux-x86_64 > kirostudio-linux-x86_64.sha256
          echo "--- 产物 ---"
          ls -la kirostudio-linux-x86_64 kirostudio-linux-x86_64.sha256
          cat kirostudio-linux-x86_64.sha256

      - name: 上传到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            kirostudio-linux-x86_64
            kirostudio-linux-x86_64.sha256

      # 发布后回验（P1-4）：把刚发布的资产重新下载回来，与本地构建产物逐字节比对。
      # 为什么不做 draft→verify→publish：无 tag 时无法演练，且发布 job 失败会留下草稿
      # （OTA 拉不到 release = 静默断更）。这里用「检测 + 响亮失败」替代，失败模式与
      # 今天相同（需人工处置），但多了「发布出去的不是我们构建的那份」的发现能力。
      - name: 发布后回验（重新下载并与本地比对）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'kirostudio-linux-x86_64*' --dir verify --clobber
          cmp kirostudio-linux-x86_64 verify/kirostudio-linux-x86_64
          (cd verify && sha256sum -c kirostudio-linux-x86_64.sha256)
          echo "✅ 发布后回验通过（Release 资产 == 本地构建产物）"

  # macOS 原生二进制：Apple Silicon(aarch64) 与 Intel(x86_64) 各一份。
  #
  # 为什么必须有这个 job：src/admin/update.rs 的 ASSET_BIN 按 OS×ARCH 选资产，
  # macOS 分支期望 kirostudio-macos-{aarch64,x86_64}。若 CI 不产出，macOS 用户点面板
  # 「一键升级」会 404（现在）——而在补齐 ASSET_BIN 之前更糟：会下到 Linux ELF 覆盖
  # 自己的 Mach-O，重启后无法执行 → 服务当场死亡。三方（CI 产出 / ASSET_BIN / installer）
  # 必须保持一致。
  #
  # runner 用 macos-14（Apple Silicon），交叉编译 x86_64 只需 rustup target add，
  # 不需要额外 C 工具链（纯 rustls，无 vendored OpenSSL；--no-default-features 与其它平台一致）。
  build-release-macos:
    needs: test
    permissions:
      contents: write   # 上传 Release 资产（仅此 job 需要写）
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: kirostudio-macos-aarch64
          - target: x86_64-apple-darwin
            asset: kirostudio-macos-x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前端必须在 cargo build 之前产出 admin-ui/dist —— rust-embed 是编译期嵌入
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: 构建前端 (admin-ui/dist)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master（官方指引：SHA 必须落在 master 历史内）
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-release-${{ matrix.target }}

      - name: 构建 release 二进制
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: 打包产物 + 生成校验和
        run: |
          BIN=target/${{ matrix.target }}/release/kirostudio
          cp "$BIN" ${{ matrix.asset }}
          # macOS 自带 shasum，输出格式与 sha256sum 一致（"<hash>  <file>"），
          # 与 update.rs 的解析（取第一段 64 位 hex）兼容。
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          echo "--- 产物 ---"
          ls -la ${{ matrix.asset }} ${{ matrix.asset }}.sha256
          cat ${{ matrix.asset }}.sha256
          file ${{ matrix.asset }}

      - name: 上传到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      # 发布后回验（P1-4）：见 Linux job 同名步骤的取舍说明。
      # macOS 无 GNU coreutils，用自带 shasum（`-c` 语义与 sha256sum -c 一致）。
      - name: 发布后回验（重新下载并与本地比对）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '${{ matrix.asset }}*' --dir verify --clobber
          cmp ${{ matrix.asset }} verify/${{ matrix.asset }}
          (cd verify && shasum -a 256 -c ${{ matrix.asset }}.sha256)
          echo "✅ 发布后回验通过（Release 资产 == 本地构建产物）"

  # Windows 原生 exe：任意 Win10+ x64 双击即跑（crt-static 静态链接 C 运行时，
  # 无 VCRUNTIME140.dll 依赖，见 .cargo/config.toml）。纯 rustls（--no-default-features），
  # 与 Linux 产物一致，避开 Windows 上 vendored OpenSSL 的工具链依赖。
  build-release-windows:
    needs: test
    permissions:
      contents: write   # 上传 Release 资产（仅此 job 需要写）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前端必须在 cargo build 之前产出 admin-ui/dist —— rust-embed 是编译期嵌入
      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: 构建前端 (admin-ui/dist)
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Rust (msvc 目标)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master（官方指引：SHA 必须落在 master 历史内）
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msvc-release

      # 纯 rustls：--no-default-features 去掉 native-tls(vendored openssl，Windows 需 Perl/NASM)。
      # 代码默认配置 tlsBackend=rustls，reqwest 内置 rustls-tls-webpki-roots，自洽。
      # crt-static 由仓库根 .cargo/config.toml 对 windows-msvc 目标自动施加。
      - name: 构建 release 二进制
        run: cargo build --release --no-default-features --target x86_64-pc-windows-msvc

      - name: 打包产物 + 生成校验和
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/kirostudio.exe"
          Copy-Item $bin kirostudio-windows-x86_64.exe
          $hash = (Get-FileHash kirostudio-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  kirostudio-windows-x86_64.exe" | Out-File -Encoding ascii kirostudio-windows-x86_64.exe.sha256
          Write-Host "--- 产物 ---"
          Get-ChildItem kirostudio-windows-x86_64.exe, kirostudio-windows-x86_64.exe.sha256
          Get-Content kirostudio-windows-x86_64.exe.sha256

      - name: 上传到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            kirostudio-windows-x86_64.exe
            kirostudio-windows-x86_64.exe.sha256

      # 发布后回验（P1-4）：见 Linux job 同名步骤的取舍说明。
      - name: 发布后回验（重新下载并与本地比对）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" `
            --pattern 'kirostudio-windows-x86_64.exe*' --dir verify --clobber
          $local = (Get-FileHash kirostudio-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          $remote = (Get-FileHash verify/kirostudio-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          if ($local -ne $remote) {
            Write-Error "发布后回验失败：Release 资产($remote) != 本地构建产物($local)"
            exit 1
          }
          Write-Host "✅ 发布后回验通过（Release 资产 == 本地构建产物）$remote"
