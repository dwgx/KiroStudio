name: build-windows-once
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: admin-ui/pnpm-lock.yaml

      - name: Build frontend
        working-directory: admin-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msvc-once

      - name: Build release
        run: cargo build --release --no-default-features --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/kirostudio.exe"
          Copy-Item $bin kirostudio-windows-x86_64.exe
          $hash = (Get-FileHash kirostudio-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  kirostudio-windows-x86_64.exe" | Out-File -Encoding ascii kirostudio-windows-x86_64.exe.sha256
          Compress-Archive -Path kirostudio-windows-x86_64.exe, kirostudio-windows-x86_64.exe.sha256 -DestinationPath kirostudio-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirostudio-windows-x86_64
          path: kirostudio-windows-x86_64.zip
